<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Settings - Smart Waste</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 min-h-screen text-slate-100">
    <main class="max-w-3xl mx-auto px-4 py-8">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-bold text-white">Settings</h1>
            <a href="/citizendashboard" class="text-sm text-blue-400 hover:text-blue-300">
                <i class="fa-solid fa-arrow-left mr-1"></i>Back to Dashboard
            </a>
        </div>

        <div class="mb-6 text-sm text-slate-300">Welcome, {{ user.name if user else 'Citizen' }}</div>

        {% if error %}
        <div class="mb-4 rounded-lg border border-red-500/40 bg-red-900/20 px-4 py-3 text-sm text-red-300">
            <i class="fa-solid fa-circle-exclamation mr-1"></i>{{ error }}
        </div>
        {% endif %}
        {% if success %}
        <div class="mb-4 rounded-lg border border-green-500/40 bg-green-900/20 px-4 py-3 text-sm text-green-300">
            <i class="fa-solid fa-circle-check mr-1"></i>{{ success }}
        </div>
        {% endif %}

        <div class="space-y-6">
            <section class="rounded-2xl border border-slate-700 bg-slate-800 p-6">
                <h2 class="text-lg font-semibold text-white mb-4">Update Profile</h2>
                <form action="/settings" method="POST" class="space-y-4">
                    <input type="hidden" name="action" value="update_profile">
                    <div>
                        <label class="block text-sm text-slate-300 mb-1">Name</label>
                        <input
                            type="text"
                            name="name"
                            value="{{ user.name if user else '' }}"
                            required
                            class="w-full rounded-lg border border-slate-600 bg-slate-900 px-3 py-2 text-slate-100 focus:border-blue-500 focus:outline-none"
                        >
                    </div>
                    <div>
                        <label class="block text-sm text-slate-300 mb-1">Zone (optional)</label>
                        <select
                            name="zone"
                            class="w-full rounded-lg border border-slate-600 bg-slate-900 px-3 py-2 text-slate-100 focus:border-blue-500 focus:outline-none"
                        >
                            <option value="">Keep current zone</option>
                            <option value="1" {% if user and user.zone == 1 %}selected{% endif %}>Zone 1</option>
                            <option value="2" {% if user and user.zone == 2 %}selected{% endif %}>Zone 2</option>
                            <option value="3" {% if user and user.zone == 3 %}selected{% endif %}>Zone 3</option>
                            <option value="4" {% if user and user.zone == 4 %}selected{% endif %}>Zone 4</option>
                            <option value="5" {% if user and user.zone == 5 %}selected{% endif %}>Zone 5</option>
                            <option value="6" {% if user and user.zone == 6 %}selected{% endif %}>Zone 6</option>
                        </select>
                    </div>
                    <button type="submit" class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-500">
                        Save Profile
                    </button>
                </form>
            </section>

            <section class="rounded-2xl border border-slate-700 bg-slate-800 p-6">
                <h2 class="text-lg font-semibold text-white mb-4">Change Password</h2>
                <form action="/settings" method="POST" class="space-y-4">
                    <input type="hidden" name="action" value="change_password">
                    <div>
                        <label class="block text-sm text-slate-300 mb-1">Old Password</label>
                        <input
                            type="password"
                            name="old_password"
                            required
                            class="w-full rounded-lg border border-slate-600 bg-slate-900 px-3 py-2 text-slate-100 focus:border-blue-500 focus:outline-none"
                        >
                    </div>
                    <div>
                        <label class="block text-sm text-slate-300 mb-1">New Password</label>
                        <input
                            type="password"
                            name="new_password"
                            required
                            class="w-full rounded-lg border border-slate-600 bg-slate-900 px-3 py-2 text-slate-100 focus:border-blue-500 focus:outline-none"
                        >
                    </div>
                    <button type="submit" class="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-500">
                        Update Password
                    </button>
                </form>
            </section>
        </div>
    </main>
</body>
</html>
