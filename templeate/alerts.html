<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SilentStorm - Alerts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .sidebar-gradient {
            background: linear-gradient(180deg, #0f172a 0%, #020617 100%);
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #334155; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569; 
        }
        .pulse-alert {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }
        .slide-in {
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>
<body class="bg-slate-900 font-sans text-slate-100 h-screen overflow-hidden flex">

    <aside class="w-64 sidebar-gradient text-white flex flex-col flex-shrink-0 transition-all duration-300 z-20 shadow-xl border-r border-slate-800">
        
        <div class="p-6 border-b border-slate-800 bg-slate-900/50">
            <div class="flex items-center gap-4">
                <div class="relative">
                    <img src="https://ui-avatars.com/api/?name=Admin+User&background=3b82f6&color=fff" alt="Admin" class="w-12 h-12 rounded-full border-2 border-green-500">
                    <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-slate-900 rounded-full"></span>
                </div>
                <div>
                    <h3 class="font-bold text-sm text-white">Amravati Corp.</h3>
                    <p class="text-xs text-slate-400">Super Admin</p>
                </div>
            </div>
        </div>
        
        <nav class="flex-1 overflow-y-auto py-6 px-3 space-y-2">
            
            <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2 px-3">Management</div>
            
            <a href="/admindashboard" class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg transition-all group">
                <i class="fa-solid fa-chart-line text-lg"></i>
                <span class="font-medium">Dashboard</span>
            </a>

            <a href="/bins" class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg transition-all group">
                <i class="fa-solid fa-trash-can text-lg"></i>
                <span class="font-medium">Bins Management</span>
            </a>

            <a href="/addbins" class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg transition-all group">
                <i class="fa-solid fa-plus text-lg text-green-400 group-hover:text-green-300"></i>
                <span class="font-medium">Add New Bin</span>
            </a>

            <a href="/removebins" class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg transition-all group">
                <i class="fa-solid fa-ban text-lg text-red-400 group-hover:text-red-300"></i>
                <span class="font-medium">Remove Bin</span>
            </a>

            <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mt-6 mb-2 px-3">Intelligence</div>

            <a href="/analysis" class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg transition-all group">
                <i class="fa-solid fa-brain text-lg text-purple-400 group-hover:text-purple-300"></i>
                <span class="font-medium">Analysis & AI</span>
            </a>

            <a href="#" class="flex items-center gap-3 px-4 py-3 bg-blue-600 rounded-lg text-white shadow-lg shadow-blue-900/20 hover:bg-blue-500 transition-all group">
                <div class="relative">
                    <i class="fa-solid fa-bell text-lg"></i>
                    <span class="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full animate-pulse"></span>
                </div>
                <span class="font-medium">Alerts</span>
            </a>

            <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mt-6 mb-2 px-3">System</div>

            <a href="/settings" class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg transition-all group">
                <i class="fa-solid fa-gear text-lg text-slate-400 group-hover:text-white"></i>
                <span class="font-medium">Settings</span>
            </a>
        </nav>

        <div class="p-4 border-t border-slate-800">
            <a href="/" class="flex items-center gap-3 px-4 py-2 text-red-400 hover:bg-slate-800 hover:text-red-300 rounded-lg transition-all">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span class="font-medium">Log Out</span>
            </a>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full overflow-hidden relative">
        
        <header class="h-20 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-8 z-10 shadow-sm">
            
            <div class="flex items-center gap-4">
                <a href="/admindashboard" class="text-slate-400 hover:text-slate-200 transition">
                    <i class="fa-solid fa-chevron-left text-lg"></i>
                </a>
                <h1 class="text-2xl font-bold text-white">
                    <span class="text-yellow-500"><i class="fa-solid fa-bell mr-2"></i>Critical Alerts</span>
                </h1>
            </div>

            <div class="flex items-center gap-4">
                <button class="p-3 rounded-full bg-slate-700 text-blue-400 hover:bg-slate-600 transition-colors" title="Refresh Alerts">
                    <i class="fa-solid fa-arrows-rotate"></i>
                </button>
                <div class="h-8 w-px bg-slate-700"></div>
                <div class="text-sm">
                    <p class="text-slate-400">Total Alerts: <span class="font-bold text-red-400" id="totalAlerts">0</span></p>
                </div>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-8 bg-slate-900">
            
            <div class="space-y-4" id="alertsContainer">
                <!-- Alerts will be populated by JavaScript -->
            </div>

            <!-- No Alerts Message -->
            <div id="noAlertsMessage" class="hidden bg-slate-800 rounded-2xl border border-slate-700 p-16 text-center">
                <i class="fa-solid fa-circle-check text-6xl text-green-500 mb-4"></i>
                <h3 class="text-xl font-bold text-slate-300 mb-2">No Critical Alerts</h3>
                <p class="text-slate-500">All systems are operating normally. No critical alerts at this moment.</p>
            </div>
        </div>
    </main>

    <script>
        // Sample critical alerts
        const alertsData = [
            {
                id: 1,
                title: 'Bin Overflow Alert',
                message: 'Bin BIN-001 at Rajapeth Market is overflowing. Immediate collection required.',
                severity: 'critical',
                binId: 'BIN-001',
                location: 'Rajapeth Market',
                timestamp: '2026-02-25 14:35:00',
                fillLevel: 98,
                icon: 'fa-triangle-exclamation'
            },
            {
                id: 2,
                title: 'Sensor Malfunction',
                message: 'BIN-007 sensor is not responding. Unable to monitor fill level.',
                severity: 'critical',
                binId: 'BIN-007',
                location: 'Station Road',
                timestamp: '2026-02-25 13:10:00',
                fillLevel: 0,
                icon: 'fa-triangle-exclamation'
            },
            {
                id: 3,
                title: 'Collection Overdue',
                message: 'BIN-002 at Gandhi Square has not been collected for 3 days. Fill level critical.',
                severity: 'critical',
                binId: 'BIN-002',
                location: 'Gandhi Square',
                timestamp: '2026-02-25 11:45:00',
                fillLevel: 95,
                icon: 'fa-clock'
            },
            {
                id: 4,
                title: 'Abnormal Activity Detected',
                message: 'Multiple quick fill-empty cycles detected at BIN-010. Possible tampering.',
                severity: 'critical',
                binId: 'BIN-010',
                location: 'Shopping Mall',
                timestamp: '2026-02-25 09:20:00',
                fillLevel: 85,
                icon: 'fa-exclamation'
            },
            {
                id: 5,
                title: 'Worker Route Deviation',
                message: 'Worker WRK-003 has deviated from assigned collection route.',
                severity: 'critical',
                binId: 'ROUTE-A',
                location: 'Zone 2',
                timestamp: '2026-02-25 08:15:00',
                fillLevel: 0,
                icon: 'fa-road'
            },
        ];

        // Render alerts
        function renderAlerts() {
            const container = document.getElementById('alertsContainer');
            const noAlertsMsg = document.getElementById('noAlertsMessage');
            
            if (alertsData.length === 0) {
                container.innerHTML = '';
                noAlertsMsg.classList.remove('hidden');
                document.getElementById('totalAlerts').textContent = '0';
                return;
            }

            noAlertsMsg.classList.add('hidden');
            container.innerHTML = '';
            document.getElementById('totalAlerts').textContent = alertsData.length;

            alertsData.forEach((alert, index) => {
                const alertCard = document.createElement('div');
                alertCard.className = 'slide-in bg-red-900/20 border-l-4 border-red-500 rounded-lg p-6 hover:bg-red-900/30 transition cursor-pointer';
                
                const timeAgo = getTimeAgo(alert.timestamp);

                alertCard.innerHTML = `
                    <div class="flex items-start justify-between gap-4">
                        <div class="flex items-start gap-4 flex-1">
                            <div class="flex-shrink-0">
                                <div class="flex items-center justify-center h-12 w-12 rounded-full bg-red-500/20">
                                    <i class="fa-solid ${alert.icon} text-red-500 text-lg pulse-alert"></i>
                                </div>
                            </div>
                            <div class="flex-1">
                                <h3 class="text-lg font-bold text-red-400">${alert.title}</h3>
                                <p class="text-slate-300 mt-1">${alert.message}</p>
                                <div class="flex items-center gap-4 mt-3 flex-wrap">
                                    <span class="inline-block px-3 py-1 rounded-full bg-slate-700 text-xs font-semibold text-slate-300">
                                        <i class="fa-solid fa-barcode mr-1"></i> ${alert.binId}
                                    </span>
                                    <span class="inline-block px-3 py-1 rounded-full bg-slate-700 text-xs font-semibold text-slate-300">
                                        <i class="fa-solid fa-map-pin mr-1"></i> ${alert.location}
                                    </span>
                                    ${alert.fillLevel > 0 ? `<span class="inline-block px-3 py-1 rounded-full bg-slate-700 text-xs font-semibold text-yellow-400">
                                        <i class="fa-solid fa-percent mr-1"></i> ${alert.fillLevel}% Full
                                    </span>` : ''}
                                </div>
                            </div>
                        </div>
                        <div class="flex-shrink-0 text-right">
                            <p class="text-xs text-slate-400">${timeAgo}</p>
                            <button class="mt-2 px-4 py-2 rounded bg-red-600 text-white text-sm font-semibold hover:bg-red-500 transition" onclick="acknowledgeAlert(${alert.id})">
                                <i class="fa-solid fa-check mr-1"></i> Acknowledge
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(alertCard);
            });
        }

        // Get time ago
        function getTimeAgo(timestamp) {
            const now = new Date();
            const alertTime = new Date(timestamp);
            const diff = Math.floor((now - alertTime) / 1000);

            if (diff < 60) return 'Just now';
            if (diff < 3600) return Math.floor(diff / 60) + ' mins ago';
            if (diff < 86400) return Math.floor(diff / 3600) + ' hours ago';
            return Math.floor(diff / 86400) + ' days ago';
        }

        // Acknowledge alert
        function acknowledgeAlert(alertId) {
            const alertIndex = alertsData.findIndex(a => a.id === alertId);
            if (alertIndex > -1) {
                alertsData.splice(alertIndex, 1);
                renderAlerts();
            }
        }

        // Initial render
        renderAlerts();

        // Auto-update time
        setInterval(() => {
            renderAlerts();
        }, 60000);
    </script>
</body>
</html>
