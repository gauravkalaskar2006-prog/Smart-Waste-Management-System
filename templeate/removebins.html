<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SilentStorm - Remove Bins</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .sidebar-gradient {
            background: linear-gradient(180deg, #0f172a 0%, #020617 100%);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        .fade-out {
            animation: fadeOut 0.3s ease-out forwards;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }

            to {
                opacity: 0;
                transform: translateX(-20px);
            }
        }

        .success-message {
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-slate-900 font-sans text-slate-100 h-screen overflow-hidden flex">

    <aside
        class="w-64 sidebar-gradient text-white flex flex-col flex-shrink-0 transition-all duration-300 z-20 shadow-xl border-r border-slate-800">

        <div class="p-6 border-b border-slate-800 bg-slate-900/50">
            <div class="flex items-center gap-4">
                <div class="relative">
                    <img src="https://ui-avatars.com/api/?name=Admin+User&background=3b82f6&color=fff" alt="Admin"
                        class="w-12 h-12 rounded-full border-2 border-green-500">
                    <span
                        class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-slate-900 rounded-full"></span>
                </div>
                <div>
                    <h3 class="font-bold text-sm text-white">Amravati Corp.</h3>
                    <p class="text-xs text-slate-400">Super Admin</p>
                </div>
            </div>
        </div>

        <nav class="flex-1 overflow-y-auto py-6 px-3 space-y-2">
            <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2 px-3">Management</div>

            <a href="/admindashboard"
                class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg transition-all group">
                <i class="fa-solid fa-chart-line text-lg"></i>
                <span class="font-medium">Dashboard</span>
            </a>

            <a href="/addbins"
                class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg transition-all group">
                <i class="fa-solid fa-trash-can text-lg text-green-400 group-hover:text-green-300"></i>
                <span class="font-medium">Add New Bin</span>
            </a>

            <a href="/removebins"
                class="flex items-center gap-3 px-4 py-3 bg-blue-600 rounded-lg text-white shadow-lg shadow-blue-900/20 hover:bg-blue-500 transition-all group">
                <i class="fa-solid fa-ban text-lg"></i>
                <span class="font-medium">Remove Bin</span>
            </a>

            <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mt-6 mb-2 px-3">Intelligence</div>

            <a href="/analysis"
                class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg transition-all group">
                <i class="fa-solid fa-brain text-lg text-purple-400 group-hover:text-purple-300"></i>
                <span class="font-medium">Analysis & AI</span>
            </a>

            <a href="/alerts"
                class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg transition-all group">
                <div class="relative">
                    <i class="fa-solid fa-bell text-lg text-yellow-400 group-hover:text-yellow-300"></i>
                    <span class="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full animate-pulse"></span>
                </div>
                <span class="font-medium">Alerts</span>
            </a>

            <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mt-6 mb-2 px-3">System</div>

            <a href="/settings"
                class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg transition-all group">
                <i class="fa-solid fa-gear text-lg text-slate-400 group-hover:text-white"></i>
                <span class="font-medium">Settings</span>
            </a>
        </nav>

        <div class="p-4 border-t border-slate-800">
            <a href="/"
                class="flex items-center gap-3 px-4 py-2 text-red-400 hover:bg-slate-800 hover:text-red-300 rounded-lg transition-all">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span class="font-medium">Log Out</span>
            </a>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full overflow-hidden relative">

        <header
            class="h-20 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-8 z-10 shadow-sm">

            <div class="flex items-center gap-4">
                <a href="/admindashboard" class="text-slate-400 hover:text-slate-200 transition">
                    <i class="fa-solid fa-chevron-left text-lg"></i>
                </a>
                <h1 class="text-2xl font-bold text-white">
                    <span class="text-red-500">Remove Bins</span>
                </h1>
            </div>

            <div class="flex-1 max-w-2xl mx-12">
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i
                            class="fa-solid fa-magnifying-glass text-slate-400 group-focus-within:text-blue-400 transition-colors"></i>
                    </div>
                    <input type="text"
                        class="w-full bg-slate-900 border border-slate-700 rounded-full py-2.5 pl-12 pr-4 text-sm text-slate-200 placeholder-slate-500 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                        id="searchInput" placeholder="Search by Bin ID or Location...">
                </div>
            </div>

            <div class="flex items-center gap-4">
                <button id="refreshBtn"
                    class="p-3 rounded-full bg-slate-700 text-blue-400 hover:bg-slate-600 transition-colors"
                    title="Refresh Data">
                    <i class="fa-solid fa-arrows-rotate"></i>
                </button>
                <div class="h-8 w-px bg-slate-700"></div>
                <div class="text-sm">
                    <p class="text-slate-400">Total Bins: <span class="font-bold text-white"
                            id="totalBinsCount">0</span></p>
                </div>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-8 bg-slate-900">

            <!-- Success Message -->
            <div id="successMessage"
                class="hidden success-message fixed top-8 right-8 bg-red-900/20 border border-red-700 rounded-lg px-6 py-4 text-red-400 flex items-center gap-3 z-50">
                <i class="fa-solid fa-trash text-lg"></i>
                <span id="successText">Bin removed successfully!</span>
            </div>

            <div class="bg-slate-800 rounded-2xl border border-slate-700 p-6">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-bold text-white text-lg"><i class="fa-solid fa-ban text-red-500 mr-2"></i> All Bins
                        (Remove Option)</h3>
                    <div class="flex gap-2">
                        <button class="text-xs px-4 py-2 rounded-lg bg-red-600 text-white hover:bg-red-500 transition"
                            data-filter="all">All</button>
                        <button
                            class="text-xs px-4 py-2 rounded-lg bg-slate-700 text-slate-300 hover:bg-slate-600 transition"
                            data-filter="critical">Critical</button>
                        <button
                            class="text-xs px-4 py-2 rounded-lg bg-slate-700 text-slate-300 hover:bg-slate-600 transition"
                            data-filter="warning">Warning</button>
                        <button
                            class="text-xs px-4 py-2 rounded-lg bg-slate-700 text-slate-300 hover:bg-slate-600 transition"
                            data-filter="normal">Normal</button>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="text-slate-400 text-xs uppercase border-b border-slate-700">
                                <th class="py-3 px-4 font-semibold">Bin ID</th>
                                <th class="py-3 px-4 font-semibold">Location</th>
                                <th class="py-3 px-4 font-semibold">Zone</th>
                                <th class="py-3 px-4 font-semibold">Severity</th>
                                <th class="py-3 px-4 font-semibold">Fill Level</th>
                                <th class="py-3 px-4 font-semibold">Last Updated</th>
                                <th class="py-3 px-4 font-semibold">Action</th>
                            </tr>
                        </thead>
                        <tbody class="text-sm" id="binsTableBody">
                            <!-- Table rows will be populated by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Default bins data (static, no Flask needed)
        const defaultBins = [
                        { id: 'BIN-001', location: 'Rajapeth Market', severity: 'critical', fillLevel: 98, lastUpdated: '5 mins ago' },
            { id: 'BIN-002', location: 'Gandhi Square', severity: 'critical', fillLevel: 95, lastUpdated: '8 mins ago' },
            { id: 'BIN-003', location: 'Main Market Zone 1', severity: 'warning', fillLevel: 88, lastUpdated: '10 mins ago' },
            { id: 'BIN-004', location: 'Bus Stand Zone 2', severity: 'critical', fillLevel: 92, lastUpdated: '3 mins ago' },
            { id: 'BIN-005', location: 'Central Park', severity: 'warning', fillLevel: 75, lastUpdated: '15 mins ago' },
            { id: 'BIN-006', location: 'High Street', severity: 'normal', fillLevel: 45, lastUpdated: '20 mins ago' },
            { id: 'BIN-007', location: 'Station Road', severity: 'critical', fillLevel: 94, lastUpdated: '2 mins ago' },
            { id: 'BIN-008', location: 'Residential Area A', severity: 'normal', fillLevel: 52, lastUpdated: '25 mins ago' },
            { id: 'BIN-009', location: 'Park Square', severity: 'warning', fillLevel: 80, lastUpdated: '12 mins ago' },
            { id: 'BIN-010', location: 'Shopping Mall', severity: 'critical', fillLevel: 91, lastUpdated: '4 mins ago' },
            { id: 'BIN-011', location: 'School Area', severity: 'normal', fillLevel: 38, lastUpdated: '30 mins ago' },
        ];

        // Load bins from localStorage (merge added + default, remove removed)
        function loadBins() {
            const addedBins = JSON.parse(localStorage.getItem('addedBins')) || [];
            let removedBins = JSON.parse(localStorage.getItem('removedBins')) || [];

            let binsData = [...defaultBins];
            // Add custom bins
            addedBins.forEach(bin => {
                if (!binsData.find(b => b.id === bin.id)) {
                    binsData.push({
                        id: bin.id,
                        location: bin.location,
                        zone: bin.zone || 'Zone 1',
                        severity: 'normal',
                        fillLevel: 15,
                        lastUpdated: 'Just added'
                    });
                }
            });
            // Remove removed bins
            binsData = binsData.filter(bin => !removedBins.includes(bin.id));
            return binsData;
        }

        let binsData = loadBins();
        let removedBins = JSON.parse(localStorage.getItem('removedBins')) || [];

        // Update total count
        document.getElementById('totalBinsCount').textContent = binsData.length;

        // Render table
        function renderTable(filteredBins) {
            const tbody = document.getElementById('binsTableBody');
            tbody.innerHTML = '';

            if (filteredBins.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="py-8 text-center text-slate-400"><i class="fa-solid fa-check-circle mr-2"></i>No bins to display.</td></tr>';
                return;
            }

            filteredBins.forEach(bin => {
                const severityColor = bin.severity === 'critical'
                    ? 'bg-red-900/40 text-red-400 border-red-800'
                    : bin.severity === 'warning'
                        ? 'bg-yellow-900/40 text-yellow-400 border-yellow-800'
                        : 'bg-green-900/40 text-green-400 border-green-800';

                const row = `
                    <tr class="border-b border-slate-700/50 hover:bg-slate-700/30 transition" id="row-${bin.id}">
                        <td class="py-4 px-4 font-medium text-slate-200">${bin.id}</td>
                        <td class="py-4 px-4 text-slate-400">${bin.location}</td>
                        <td class="py-4 px-4 text-slate-300 font-medium">${bin.zone || '-'}</td>
                        <td class="py-4 px-4">
                            <span class="px-3 py-1 rounded-full border text-xs font-bold ${severityColor}">
                                ${bin.severity.charAt(0).toUpperCase() + bin.severity.slice(1)}
                            </span>
                        </td>
                        <td class="py-4 px-4">
                            <div class="w-full bg-slate-700 rounded-full h-2">
                                <div class="bg-blue-500 h-2 rounded-full" style="width: ${bin.fillLevel}%"></div>
                            </div>
                            <span class="text-xs text-slate-400 mt-1 block">${bin.fillLevel}%</span>
                        </td>
                        <td class="py-4 px-4 text-slate-500">${bin.lastUpdated}</td>
                        <td class="py-4 px-4">
                            <button class="bg-red-600 text-white px-4 py-2 rounded text-xs font-semibold hover:bg-red-500 transition remove-btn" data-bin-id="${bin.id}">
                                <i class="fa-solid fa-trash mr-1"></i> Remove
                            </button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });

            // Re-attach remove listeners
            document.querySelectorAll('.remove-btn').forEach(btn => {
                btn.addEventListener('click', function () {
                    const binId = this.getAttribute('data-bin-id');
                    const bin = binsData.find(b => b.id === binId);
                    if (!bin) return;
                    if (confirm(`Are you sure you want to remove bin ${bin.id} from ${bin.location}?`)) {
                        removedBins.push(bin.id);
                        localStorage.setItem('removedBins', JSON.stringify(removedBins));

                        const row = document.getElementById(`row-${binId}`);
                        if (row) row.classList.add('fade-out');

                        setTimeout(() => {
                            binsData = binsData.filter(b => b.id !== binId);
                            document.getElementById('totalBinsCount').textContent = binsData.length;

                            const successDiv = document.getElementById('successMessage');
                            document.getElementById('successText').textContent = `✓ Bin ${bin.id} removed successfully!`;
                            successDiv.classList.remove('hidden');

                            renderTable(binsData);
                            setTimeout(() => successDiv.classList.add('hidden'), 3000);
                        }, 300);
                    }
                });
            });
        }

        // Initial render
        renderTable(binsData);

        // Search
        document.getElementById('searchInput').addEventListener('keyup', function () {
            const term = this.value.toLowerCase();
            renderTable(binsData.filter(bin =>
                bin.id.toLowerCase().includes(term) ||
                bin.location.toLowerCase().includes(term) ||
                (bin.zone && bin.zone.toLowerCase().includes(term))
            ));
        });

        // Filter buttons
        document.querySelectorAll('[data-filter]').forEach(button => {
            button.addEventListener('click', function () {
                document.querySelectorAll('[data-filter]').forEach(b => {
                    b.classList.remove('bg-red-600', 'text-white');
                    b.classList.add('bg-slate-700', 'text-slate-300');
                });
                this.classList.remove('bg-slate-700', 'text-slate-300');
                this.classList.add('bg-red-600', 'text-white');

                const filter = this.getAttribute('data-filter');
                let filtered = filter === 'all' ? binsData : binsData.filter(bin => bin.severity === filter);
                renderTable(filtered);
            });
        });

        // Refresh button
        document.getElementById('refreshBtn').addEventListener('click', function () {
            binsData = loadBins();
            removedBins = JSON.parse(localStorage.getItem('removedBins')) || [];
            document.getElementById('totalBinsCount').textContent = binsData.length;
            renderTable(binsData);
        });
    </script>
</body>

</html>
